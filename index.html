/* ---- window.storage polyfill (localStorage-backed) ----
   Claude artifacts provide a real window.storage API. Outside Claude,
   this shim reproduces it using the browser's localStorage so the app's
   persistence logic works unmodified when opened directly in a browser. */
(function () {
  function k(key, shared) { return (shared ? "wa_shared__" : "wa_personal__") + key; }
  window.storage = {
    get: async function (key, shared) {
      const raw = localStorage.getItem(k(key, shared));
      if (raw === null) return null;
      return { key: key, value: raw, shared: !!shared };
    },
    set: async function (key, value, shared) {
      localStorage.setItem(k(key, shared), value);
      return { key: key, value: value, shared: !!shared };
    },
    delete: async function (key, shared) {
      const existed = localStorage.getItem(k(key, shared)) !== null;
      localStorage.removeItem(k(key, shared));
      return { key: key, deleted: existed, shared: !!shared };
    },
    list: async function (prefix, shared) {
      const pfx = k(prefix || "", shared);
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const full = localStorage.key(i);
        if (full && full.startsWith(pfx)) keys.push(full.slice((shared ? "wa_shared__" : "wa_personal__").length));
      }
      return { keys: keys, prefix: prefix, shared: !!shared };
    }
  };
})();
</script>

/* ============================================================
   STORAGE HELPERS
   ============================================================ */
async function hashPassword(pw) {
  // Prefer real SHA-256 via the Web Crypto API, but some sandboxed preview
  // environments (opaque iframe origins) don't expose crypto.subtle at all.
  // Fall back to a deterministic non-cryptographic hash so auth never breaks —
  // this is a client-side demo store either way, not a production auth system.
  if (window.crypto?.subtle?.digest) {
    try {
      const enc = new TextEncoder().encode(pw);
      const buf = await window.crypto.subtle.digest("SHA-256", enc);
      return "sha256:" + Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    } catch { /* fall through to fallback hash below */ }
  }
  let h1 = 0xdeadbeef ^ pw.length, h2 = 0x41c6ce57 ^ pw.length;
  for (let i = 0; i < pw.length; i++) {
    const ch = pw.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return "fnv:" + (h1 >>> 0).toString(16).padStart(8, "0") + (h2 >>> 0).toString(16).padStart(8, "0");
}
function genCode(len = 8) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for (let i = 0; i < len; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}
async function getJSON(key, fallback) {
  try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; }
  catch { return fallback; }
}
async function setJSON(key, value) {
  // Never let a storage hiccup silently break navigation — the caller has
  // already updated React state optimistically, so a failed write here should
  // just mean "didn't persist this time," not "the button did nothing."
  try { await window.storage.set(key, JSON.stringify(value)); return true; }
  catch (e) { console.warn(`Web Academy: failed to save "${key}"`, e); return false; }
}

function todayStr() { return new Date().toISOString().slice(0, 10); }
function withActivity(data) {
  const t = todayStr();
  if (data.activityDates?.includes(t)) return data;
  return { ...data, activityDates: [...(data.activityDates || []), t] };
}
function longestStreak(dates) {
  if (!dates || dates.length === 0) return 0;
  const days = [...new Set(dates)].map((d) => Math.round(new Date(d + "T00:00:00").getTime() / 86400000)).sort((a, b) => a - b);
  let best = 1, cur = 1;
  for (let i = 1; i < days.length; i++) { cur = days[i] === days[i - 1] + 1 ? cur + 1 : 1; best = Math.max(best, cur); }
  return best;
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });
}
function submissionStatus(assignment, submission) {
  if (!submission) return "not_submitted";
  if (submission.grade !== null && submission.grade !== undefined) return "graded";
  if (assignment.dueDate && new Date(submission.submittedAt) > new Date(assignment.dueDate)) return "late";
  return "submitted";
}

function Login({ go, onLogin }) {
  const [form, setForm] = useState({ identifier: "", password: "" });
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault(); setError("");
    if (!form.identifier || !form.password) { setError("Enter your email/username and password."); return; }
    setBusy(true);
    try {
      const users = await ensureDemoUsers();
      const user = users.find((u) => u.email.toLowerCase() === form.identifier.toLowerCase() || u.username.toLowerCase() === form.identifier.toLowerCase());
      if (!user) { setError("No account found with that email or username."); setBusy(false); return; }
      if (user.suspended) { setError("This account has been suspended. Contact an administrator."); setBusy(false); return; }
      const hash = await hashPassword(form.password);
      if (hash !== user.passwordHash) { setError("Incorrect password."); setBusy(false); return; }
      await onLogin(user);
    } catch (err) { console.error("Web Academy login failed:", err); setError("Something went wrong logging you in. Please try again."); }
    setBusy(false);
  };

  return (
    <AuthShell title="Welcome back" subtitle="Log in to continue.">
      <form onSubmit={submit}>
        <Input label="Email or username" value={form.identifier} onChange={(e) => setForm({ ...form, identifier: e.target.value })} placeholder="you@example.com" />
        <Input label="Password" type="password" value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} placeholder="••••••••" />
        <div className="flex items-center justify-between mb-5 text-sm" style={{ ...fBody }}>
          <label className="flex items-center gap-2" style={{ color: C.textMuted }}><input type="checkbox" /> Remember me</label>
          <span style={{ color: C.textMuted }}>Forgot password?</span>
        </div>
        {error && <div className="flex items-center gap-2 mb-4 text-sm px-3 py-2 rounded-lg" style={{ backgroundColor: `${C.danger}1A`, color: C.danger, ...fBody }}><AlertCircle size={14} />{error}</div>}
        <Btn type="submit" className="w-full" size="lg" disabled={busy}>{busy ? "Logging in..." : "Log in"}</Btn>
      </form>
      <div className="mt-4">
        <p className="text-xs text-center mb-2" style={{ color: C.textMuted, ...fMono }}>Fill demo credentials</p>
        <div className="grid grid-cols-3 gap-2">
          <button onClick={() => setForm({ identifier: DEMO_STUDENT.email, password: DEMO_PW.student })} className="text-xs py-2 rounded-lg" style={{ backgroundColor: C.ink2, color: C.textMuted, ...fMono }}>Student</button>
          <button onClick={() => setForm({ identifier: DEMO_INSTRUCTOR.email, password: DEMO_PW.instructor })} className="text-xs py-2 rounded-lg" style={{ backgroundColor: C.ink2, color: C.textMuted, ...fMono }}>Instructor</button>

        </div>
      </div>
      <p className="text-sm text-center mt-6" style={{ color: C.textMuted, ...fBody }}>New here? <button onClick={() => go("register")} className="font-semibold" style={{ color: C.copper }}>Create an account</button></p>
    </AuthShell>
  );
}
function Register({ go, onLogin }) {
  const [form, setForm] = useState({ fullName: "", username: "", email: "", phone: "", password: "", confirm: "" });
  const [errors, setErrors] = useState({});
  const [busy, setBusy] = useState(false);
  const [formError, setFormError] = useState("");

  const validate = (users) => {
    const e = {};
    if (!form.fullName.trim()) e.fullName = "Full name is required.";
    if (!/^[a-zA-Z0-9_.]{3,20}$/.test(form.username)) e.username = "3-20 characters: letters, numbers, dots, underscores.";
    else if (users.find((u) => u.username.toLowerCase() === form.username.toLowerCase())) e.username = "That username is taken.";
    if (!/^\S+@\S+\.\S+$/.test(form.email)) e.email = "Enter a valid email address.";
    else if (users.find((u) => u.email.toLowerCase() === form.email.toLowerCase())) e.email = "An account already uses this email.";
    if (form.phone && !/^[0-9+\-\s()]{7,}$/.test(form.phone)) e.phone = "Enter a valid phone number.";
    if (!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(form.password)) e.password = "At least 8 characters, with a letter and a number.";
    if (form.confirm !== form.password) e.confirm = "Passwords don't match.";
    return e;
  };
  const submit = async (e) => {
    e.preventDefault(); setFormError(""); setBusy(true);
    try {
      const users = await ensureDemoUsers();
      const errs = validate(users);
      setErrors(errs);
      if (Object.keys(errs).length > 0) { setBusy(false); return; }
      const passwordHash = await hashPassword(form.password);
      const newUser = { id: uid("u"), fullName: form.fullName.trim(), username: form.username.trim(), email: form.email.trim(), phone: form.phone.trim(), role: "student", passwordHash };
      await setJSON("wa:users", [...users, newUser]);
      await onLogin(newUser);
    } catch (err) { console.error("Web Academy registration failed:", err); setFormError("Something went wrong creating your account. Please try again."); }
    setBusy(false);
  };
  return (
    <AuthShell title="Create your account" subtitle="Join and start your first course today.">
      {Object.keys(errors).length > 0 && (
        <div className="flex items-center gap-2 mb-4 text-sm px-3 py-2 rounded-lg" style={{ backgroundColor: `${C.danger}1A`, color: C.danger, ...fBody }}>
          <AlertCircle size={14} />Please fix the highlighted field{Object.keys(errors).length > 1 ? "s" : ""} below.
        </div>
      )}
      <form onSubmit={submit}>
        <Input label="Full name" value={form.fullName} onChange={(e) => setForm({ ...form, fullName: e.target.value })} error={errors.fullName} placeholder="Jordan Rivera" />
        <Input label="Username" value={form.username} onChange={(e) => setForm({ ...form, username: e.target.value })} error={errors.username} placeholder="jordan.rivera" />
        <Input label="Email" type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} error={errors.email} placeholder="you@example.com" />
        <Input label="Phone number (optional)" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} error={errors.phone} placeholder="+1 555 000 0000" />
        <Input label="Password" type="password" value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} error={errors.password} placeholder="8+ characters" />
        <Input label="Confirm password" type="password" value={form.confirm} onChange={(e) => setForm({ ...form, confirm: e.target.value })} error={errors.confirm} placeholder="Repeat password" />
        {formError && <div className="flex items-center gap-2 mb-4 text-sm px-3 py-2 rounded-lg" style={{ backgroundColor: `${C.danger}1A`, color: C.danger, ...fBody }}><AlertCircle size={14} />{formError}</div>}
        <Btn type="submit" className="w-full" size="lg" disabled={busy}>{busy ? "Creating account..." : "Create account"}</Btn>
      </form>
      <p className="text-sm text-center mt-6" style={{ color: C.textMuted, ...fBody }}>Already have an account? <button onClick={() => go("login")} className="font-semibold" style={{ color: C.copper }}>Log in</button></p>
    </AuthShell>
  );
}

  );

/* ============================================================
   QUIZ
   ============================================================ */
function Quiz({ quiz, onSubmit, previousAttempt }) {
  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState(!!previousAttempt);
  const [result, setResult] = useState(previousAttempt || null);
  useEffect(() => { setSubmitted(!!previousAttempt); setResult(previousAttempt || null); setAnswers({}); }, [quiz.id]);
  const setAnswer = (qid, val) => setAnswers((a) => ({ ...a, [qid]: val }));
  const submit = () => {
    let correct = 0;
    const review = quiz.questions.map((q) => { const given = answers[q.id]; const isCorrect = given === q.correct; if (isCorrect) correct++; return { id: q.id, given, isCorrect }; });
    const pct = Math.round((correct / quiz.questions.length) * 100);
    const passed = pct >= quiz.passPercent;
    const res = { score: correct, total: quiz.questions.length, pct, passed, review, date: new Date().toISOString() };
    setResult(res); setSubmitted(true); onSubmit(res);
  };
  const allAnswered = quiz.questions.every((q) => answers[q.id] !== undefined);
  if (submitted && result) {
    return (
      <div>
        <div className="rounded-2xl p-6 text-center mb-6" style={{ backgroundColor: result.passed ? `${C.mint}1A` : `${C.danger}1A`, border: `1px solid ${result.passed ? C.mint : C.danger}` }}>
          {result.passed ? <Award size={32} color={C.mint} className="mx-auto mb-2" /> : <AlertCircle size={32} color={C.danger} className="mx-auto mb-2" />}
          <h3 className="text-xl font-bold mb-1" style={{ ...fDisplay, color: C.textLight }}>{result.passed ? "Quiz Completed" : "Not Quite — Try Again"}</h3>
          <p className="text-lg font-semibold" style={{ ...fMono, color: result.passed ? C.mint : C.danger }}>{result.score}/{result.total} — {result.pct}%</p>
          <p className="text-xs mt-1" style={{ color: C.textMuted, ...fBody }}>Passing score: {quiz.passPercent}%</p>
        </div>
        <h4 className="font-semibold mb-3" style={{ ...fDisplay, color: C.textLight }}>Review your answers</h4>
        <div className="space-y-3 mb-6">
          {quiz.questions.map((q, i) => {
            const r = result.review.find((x) => x.id === q.id);
            const options = q.type === "tf" ? ["True", "False"] : q.options;
            const givenLabel = q.type === "tf" ? (r.given ? "True" : "False") : options[r.given];
            const correctLabel = q.type === "tf" ? (q.correct ? "True" : "False") : options[q.correct];
            return (
              <div key={q.id} className="rounded-xl p-4" style={{ backgroundColor: C.inkSoft, border: `1px solid ${r.isCorrect ? C.mint : C.danger}55` }}>
                <p className="text-sm font-medium mb-2" style={{ color: C.textLight, ...fBody }}>{i + 1}. {q.question}</p>
                <p className="text-xs" style={{ color: r.isCorrect ? C.mint : C.danger, ...fMono }}>Your answer: {givenLabel ?? "—"}</p>
                {!r.isCorrect && <p className="text-xs" style={{ color: C.mint, ...fMono }}>Correct answer: {correctLabel}</p>}
              </div>
            );
          })}
        </div>
        {!result.passed && <Btn onClick={() => { setSubmitted(false); setAnswers({}); }} variant="outline">Retake quiz</Btn>}
      </div>
    );
  }
  return (
    <div>
      <div className="flex items-center gap-2 mb-5"><ClipboardCheck size={18} color={C.copper} /><h3 className="text-lg font-semibold" style={{ ...fDisplay, color: C.textLight }}>{quiz.title}</h3></div>
      <div className="space-y-5 mb-6">
        {quiz.questions.map((q, i) => (
          <div key={q.id} className="rounded-xl p-4" style={{ backgroundColor: C.inkSoft, border: `1px solid ${C.inkLine}` }}>
            <p className="text-sm font-medium mb-3" style={{ color: C.textLight, ...fBody }}>{i + 1}. {q.question}</p>
            <div className="space-y-2">
              {(q.type === "tf" ? [{ label: "True", val: true }, { label: "False", val: false }] : q.options.map((o, oi) => ({ label: o, val: oi }))).map((opt) => (
                <button key={String(opt.val)} onClick={() => setAnswer(q.id, opt.val)} className="w-full text-left flex items-center gap-2.5 px-3.5 py-2.5 rounded-lg text-sm transition-colors" style={{ backgroundColor: answers[q.id] === opt.val ? `${C.copper}22` : C.ink2, border: `1px solid ${answers[q.id] === opt.val ? C.copper : C.inkLine}`, color: C.textLight, ...fBody }}>
                  {answers[q.id] === opt.val ? <CheckCircle2 size={15} color={C.copper} /> : <Circle size={15} color={C.textMuted} />}{opt.label}
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>
      <Btn onClick={submit} disabled={!allAnswered} size="lg">Submit quiz</Btn>
      {!allAnswered && <p className="text-xs mt-2" style={{ color: C.textMuted, ...fBody }}>Answer every question to submit.</p>}
    </div>
  );
}

function LessonViewer({ courseId, itemId, go, user, courses, studentData, onMarkComplete, onQuizSubmit }) {
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const course = courses.find((c) => c.id === courseId);
  if (!course) return null;
  const items = flattenItems(course);
  const idx = items.findIndex((it) => it.id === itemId);
  const item = items[idx];
  if (!item) return null;
  const isEnrolled = studentData?.enrollments.some((e) => e.courseId === course.id);
  if (!user) { go("login"); return null; }
  if (!isEnrolled) return <EmptyState icon={Lock} text="Enroll in this course to access its lessons." action={<Btn className="mt-4" onClick={() => go("course", { id: course.id })}>Go to course</Btn>} />;

  const prevItem = items[idx - 1]; const nextItem = items[idx + 1]; const done = !!studentData.progress[pk(course.id, item.id)];

  return (
    <div className="flex" style={{ minHeight: "calc(100vh - 61px)" }}>
      <div className={`fixed lg:sticky top-[61px] left-0 z-30 w-72 shrink-0 h-[calc(100vh-61px)] overflow-y-auto transition-transform ${sidebarOpen ? "translate-x-0" : "-translate-x-full lg:translate-x-0"}`} style={{ backgroundColor: C.inkSoft, borderRight: `1px solid ${C.inkLine}` }}>
        <div className="p-4 border-b" style={{ borderColor: C.inkLine }}>
          <button onClick={() => go("course", { id: course.id })} className="text-xs flex items-center gap-1 mb-2" style={{ color: C.textMuted, ...fMono }}><ChevronLeft size={12} /> Back to course</button>
          <p className="text-sm font-semibold" style={{ color: C.textLight, ...fDisplay }}>{course.title}</p>
        </div>
        {course.modules.map((m, mi) => (
          <div key={m.id} className="px-4 py-3">
            <p className="text-xs font-bold mb-2" style={{ color: C.copper, ...fMono }}>MODULE {mi + 1} — {m.title.toUpperCase()}</p>
            {m.items.map((it, ii) => {
              const active = it.id === itemId; const itDone = !!studentData.progress[pk(course.id, it.id)]; const isLast = ii === m.items.length - 1;
              return (
                <button key={it.id} onClick={() => { go("lesson", { courseId: course.id, itemId: it.id }); setSidebarOpen(false); }} className="w-full flex items-start gap-2.5 py-1.5 text-left">
                  <div className="flex flex-col items-center">
                    <div className="w-3 h-3 rounded-full shrink-0" style={{ backgroundColor: itDone ? C.mint : active ? C.copper : "transparent", border: `2px solid ${itDone ? C.mint : active ? C.copper : C.inkLine}` }} />
                    {!isLast && <div className="w-px flex-1 min-h-[14px]" style={{ backgroundColor: itDone ? C.mint : C.inkLine }} />}
                  </div>
                  <span className="text-xs pb-2 flex items-center gap-1.5" style={{ color: active ? C.textLight : C.textMuted, fontWeight: active ? 600 : 400, ...fBody }}>{it.type === "quiz" && <ClipboardCheck size={11} />}{it.title}</span>
                </button>
              );
            })}
          </div>
        ))}
      </div>
      {sidebarOpen && <div className="fixed inset-0 z-20 lg:hidden" style={{ backgroundColor: "#000000AA" }} onClick={() => setSidebarOpen(false)} />}
      <div className="flex-1 min-w-0">
        <div className="max-w-2xl mx-auto px-5 py-8">
          <button onClick={() => setSidebarOpen(true)} className="lg:hidden mb-4 flex items-center gap-2 text-xs" style={{ color: C.textMuted, ...fMono }}><Menu size={14} /> Course menu</button>
          <p className="text-xs font-bold mb-2" style={{ color: C.copper, ...fMono }}>{item.moduleTitle.toUpperCase()}</p>
          <h1 className="text-2xl md:text-3xl font-bold mb-6" style={{ ...fDisplay, color: C.textLight }}>{item.title}</h1>
          {item.type === "quiz" ? <Quiz quiz={item} previousAttempt={studentData.quizAttempts[pk(course.id, item.id)]} onSubmit={(res) => onQuizSubmit(course.id, item.id, item.title, res)} /> : (
            <div>
              {item.content.split("\n\n").map((p, i) => <p key={i} className="text-[15px] leading-7 mb-4" style={{ color: "#D8D3C4", ...fBody }}>{p}</p>)}
              {item.code && <pre className="rounded-xl p-4 overflow-x-auto mb-4 text-sm" style={{ backgroundColor: "#0A0F17", border: `1px solid ${C.inkLine}`, color: "#B8E3C9", ...fMono }}><code>{item.code}</code></pre>}
              {course.category === "Web Development" && (
                <button onClick={() => go("playground")} className="inline-flex items-center gap-1.5 text-xs font-semibold mb-4" style={{ color: C.copper, ...fMono }}><Terminal size={13} /> Try this in the Code Playground</button>
              )}
            </div>
          )}
          <div className="flex items-center justify-between mt-10 pt-6 border-t" style={{ borderColor: C.inkLine }}>
            <div>{prevItem ? <Btn variant="outline" icon={ChevronLeft} onClick={() => go("lesson", { courseId: course.id, itemId: prevItem.id })}>Previous</Btn> : <span />}</div>
            <div className="flex items-center gap-2">
              {item.type === "lesson" && <Btn variant={done ? "outline" : "mint"} icon={CheckCircle2} onClick={() => onMarkComplete(course.id, item.id)}>{done ? "Completed" : "Mark as complete"}</Btn>}
              {nextItem ? <Btn onClick={() => go("lesson", { courseId: course.id, itemId: nextItem.id })}>Next<ChevronRight size={16} /></Btn> : <Btn variant="mint" icon={Award} onClick={() => go("course", { id: course.id })}>Finish course</Btn>}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Dashboard({ go, user, courses, studentData, computeCourseStats, certificates, announcements, onReadAnnouncement, assignments = [], submissions = [] }) {
  const enrolledCourses = courses.filter((c) => studentData.enrollments.some((e) => e.courseId === c.id));
  const statsPerCourse = enrolledCourses.map((c) => ({ course: c, ...computeCourseStats(c, studentData) }));
  const completed = statsPerCourse.filter((s) => s.pct === 100).length;
  const inProgress = statsPerCourse.filter((s) => s.pct > 0 && s.pct < 100).length;
  const quizScores = Object.values(studentData.quizAttempts);
  const avgQuiz = quizScores.length ? Math.round(quizScores.reduce((a, b) => a + b.pct, 0) / quizScores.length) : null;
  const continueCourse = statsPerCourse.find((s) => s.pct > 0 && s.pct < 100) || statsPerCourse[0];
  const relevantAnnouncements = announcements.filter((a) => a.audience === "platform" || studentData.enrollments.some((e) => e.courseId === a.courseId)).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const enrolledCourseIds = new Set(enrolledCourses.map((c) => c.id));
  const upcomingAssignments = assignments
    .filter((a) => enrolledCourseIds.has(a.courseId))
    .map((a) => ({ assignment: a, sub: submissions.find((s) => s.assignmentId === a.id && s.studentId === user.id) || null }))
    .filter(({ sub, assignment }) => submissionStatus(assignment, sub) !== "graded")
    .sort((a, b) => (a.assignment.dueDate ? new Date(a.assignment.dueDate) : Infinity) - (b.assignment.dueDate ? new Date(b.assignment.dueDate) : Infinity))
    .slice(0, 6);
  const gradedCount = submissions.filter((s) => s.studentId === user.id && s.grade !== null && s.grade !== undefined).length;
  const badgeCtx = { certificates, studentData, gradedCount };
  const earnedBadges = BADGES.filter((b) => b.check(badgeCtx)).length;

  return (
    <div className="max-w-6xl mx-auto px-5 py-10">
      <h1 className="text-3xl font-bold mb-1" style={{ ...fDisplay, color: C.textLight }}>Welcome back, {user.fullName.split(" ")[0]} 👋</h1>
      <p className="mb-8" style={{ color: C.textMuted, ...fBody }}>Here's where you left off.</p>
      <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
        <StatCard icon={BookOpen} label="Enrolled Courses" value={enrolledCourses.length} />
        <StatCard icon={Award} label="Completed" value={completed} />

function CertificatePage({ courseId, user, courses, studentData, certificates, computeCourseStats, onGenerate, go }) {
  const course = courses.find((c) => c.id === courseId);
  if (!course) return null;
  const stats = computeCourseStats(course, studentData);
  const existing = certificates.find((c) => c.courseId === courseId);
  if (stats.pct < 100) return <EmptyState icon={Lock} text={`Complete every lesson and quiz to unlock your certificate. ${stats.pct}% complete.`} action={<Btn className="mt-4" onClick={() => go("course", { id: course.id })}>Back to course</Btn>} />;
  const cert = existing || null;
  return (
    <div className="max-w-3xl mx-auto px-5 py-14">
      {!cert ? (
        <div className="text-center mb-8">
          <Award size={36} color={C.mint} className="mx-auto mb-3" />
          <h1 className="text-2xl font-bold mb-2" style={{ ...fDisplay, color: C.textLight }}>You completed the course!</h1>
          <p className="mb-5" style={{ color: C.textMuted, ...fBody }}>Generate your certificate for {course.title}.</p>
          <Btn size="lg" onClick={() => onGenerate(course)}>Generate certificate</Btn>
        </div>
      ) : (
        <div>
          <div className="rounded-2xl p-10 md:p-14 text-center relative" style={{ backgroundColor: C.paper, border: `3px solid ${C.copper}` }}>
            <div className="absolute inset-3 rounded-xl pointer-events-none" style={{ border: `1px solid ${C.copperSoft}` }} />
            <GraduationCap size={30} color={C.copper} className="mx-auto mb-3" />
            <p className="text-xs font-bold tracking-[0.25em] mb-6" style={{ ...fMono, color: C.copper }}>WEB ACADEMY</p>
            <p className="text-sm mb-2" style={{ color: "#5A4A38", ...fBody }}>This certificate is proudly presented to</p>
            <h2 className="text-3xl md:text-4xl font-bold mb-4" style={{ ...fDisplay, color: "#1B2430" }}>{cert.studentName}</h2>
            <p className="text-sm mb-2" style={{ color: "#5A4A38", ...fBody }}>for successfully completing</p>
            <h3 className="text-xl font-semibold mb-8" style={{ ...fDisplay, color: "#1B2430" }}>{cert.courseName}</h3>
            <div className="flex flex-wrap justify-center gap-8 text-xs" style={{ ...fMono, color: "#5A4A38" }}>
              <div><p className="font-semibold text-[#1B2430]">{new Date(cert.date).toLocaleDateString()}</p><p>Completion Date</p></div>
              <div><p className="font-semibold text-[#1B2430]">{cert.instructor}</p><p>Instructor</p></div>
              <div><p className="font-semibold text-[#1B2430]">{cert.id}</p><p>Certificate ID</p></div>
              <div><p className="font-semibold text-[#1B2430]">{cert.code}</p><p>Verification Code</p></div>
            </div>
          </div>
          <div className="flex justify-center gap-3 mt-6"><Btn variant="outline" onClick={() => window.print()}>Print / Save as PDF</Btn><Btn onClick={() => go("verify")}>Verify this certificate</Btn></div>
        </div>
      )}
    </div>
  );
}
function VerifyPage() {
  const [input, setInput] = useState(""); const [result, setResult] = useState(null); const [searched, setSearched] = useState(false);
  const check = async () => {
    const all = await getJSON("wa:certificates", []);
    const found = all.find((c) => (c.id.toLowerCase() === input.trim().toLowerCase() || c.code.toLowerCase() === input.trim().toLowerCase()) && !c.revoked);
    setResult(found || null); setSearched(true);
  };
  return (
    <div className="max-w-lg mx-auto px-5 py-16">
      <ShieldCheck size={30} color={C.copper} className="mb-3" />
      <h1 className="text-2xl font-bold mb-2" style={{ ...fDisplay, color: C.textLight }}>Verify a certificate</h1>
      <p className="mb-6" style={{ color: C.textMuted, ...fBody }}>Enter a certificate ID or verification code to confirm it was issued by Web Academy.</p>
      <div className="flex gap-2 mb-6">
        <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="e.g. CERT-XXXXXX" className="flex-1 rounded-lg px-3.5 py-2.5 text-sm outline-none" style={{ backgroundColor: C.inkSoft, color: C.textLight, border: `1px solid ${C.inkLine}`, ...fMono }} />
        <Btn onClick={check} disabled={!input.trim()}>Verify</Btn>
      </div>
      {searched && (result ? (
        <div className="rounded-xl p-5" style={{ backgroundColor: `${C.mint}1A`, border: `1px solid ${C.mint}` }}>
          <div className="flex items-center gap-2 mb-3" style={{ color: C.mint }}><CheckCircle2 size={18} /><span className="font-semibold" style={{ ...fBody }}>Valid certificate</span></div>
          <p className="text-sm" style={{ color: C.textLight, ...fBody }}><b>{result.studentName}</b> completed <b>{result.courseName}</b></p>
          <p className="text-xs mt-2" style={{ color: C.textMuted, ...fMono }}>Issued {new Date(result.date).toLocaleDateString()} · Instructor: {result.instructor}</p>
        </div>
      ) : (
        <div className="rounded-xl p-5 flex items-center gap-2" style={{ backgroundColor: `${C.danger}1A`, border: `1px solid ${C.danger}`, color: C.danger }}><AlertCircle size={18} /><span className="text-sm" style={{ ...fBody }}>No certificate found with that ID or code.</span></div>
      ))}
    </div>
  );
}

/* ============================================================
   COURSE EDITOR (Instructor + Admin)
   ============================================================ */
function blankCourse(instructorId, instructorName, category) {
  return { id: uid("course"), title: "", category: category || SEED_CATEGORIES[0], level: "Beginner", instructor: instructorName, instructorId, rating: 5.0, students: 0, duration: "4 weeks", thumbnailIcon: "BookOpen", description: "", objectives: [""], requirements: [""], modules: [] };
}
function ListEditor({ items, onChange, placeholder }) {
  const update = (i, val) => { const next = [...items]; next[i] = val; onChange(next); };
  const remove = (i) => onChange(items.filter((_, idx) => idx !== i));
  return (
    <div className="space-y-2 mb-2">
      {items.map((val, i) => (
        <div key={i} className="flex gap-2">
          <input value={val} onChange={(e) => update(i, e.target.value)} placeholder={placeholder} className="flex-1 rounded-lg px-3 py-2 text-sm outline-none" style={{ backgroundColor: C.ink2, color: C.textLight, border: `1px solid ${C.inkLine}`, ...fBody }} />
          <IconBtn icon={Trash2} tone="danger" onClick={() => remove(i)} title="Remove" />
        </div>
      ))}
      <button onClick={() => onChange([...items, ""])} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.copper, ...fMono }}><Plus size={13} /> Add</button>
    </div>
  );
}
function QuestionEditor({ questions, onChange }) {
  const addQuestion = () => onChange([...questions, q(uid("q"), "mc", "", ["", "", "", ""], 0)]);
  const update = (i, patch) => { const next = [...questions]; next[i] = { ...next[i], ...patch }; onChange(next); };
  const remove = (i) => onChange(questions.filter((_, idx) => idx !== i));
  return (
    <div className="space-y-3">
      {questions.map((qq, i) => (
        <div key={qq.id} className="rounded-lg p-3" style={{ backgroundColor: C.ink, border: `1px solid ${C.inkLine}` }}>
          <div className="flex items-center gap-2 mb-2">
            <select value={qq.type} onChange={(e) => update(i, { type: e.target.value, correct: e.target.value === "tf" ? true : 0 })} className="text-xs rounded px-2 py-1" style={{ backgroundColor: C.ink2, color: C.textLight, border: `1px solid ${C.inkLine}`, ...fMono }}>
              <option value="mc">Multiple choice</option><option value="tf">True / False</option>
            </select>
            <div className="flex-1" />
            <IconBtn icon={Trash2} tone="danger" onClick={() => remove(i)} title="Remove question" />
          </div>
          <input value={qq.question} onChange={(e) => update(i, { question: e.target.value })} placeholder="Question text" className="w-full mb-2 rounded-lg px-3 py-2 text-sm outline-none" style={{ backgroundColor: C.ink2, color: C.textLight, border: `1px solid ${C.inkLine}`, ...fBody }} />
          {qq.type === "mc" ? (
            <div className="space-y-1.5">
              {qq.options.map((opt, oi) => (
                <div key={oi} className="flex items-center gap-2">
                  <input type="radio" checked={qq.correct === oi} onChange={() => update(i, { correct: oi })} />
                  <input value={opt} onChange={(e) => { const opts = [...qq.options]; opts[oi] = e.target.value; update(i, { options: opts }); }} placeholder={`Option ${oi + 1}`} className="flex-1 rounded-lg px-3 py-1.5 text-sm outline-none" style={{ backgroundColor: C.ink2, color: C.textLight, border: `1px solid ${C.inkLine}`, ...fBody }} />
                </div>
              ))}
            </div>
          ) : (
            <div className="flex gap-2 text-sm" style={{ ...fBody, color: C.textLight }}>
              <label className="flex items-center gap-1.5"><input type="radio" checked={qq.correct === true} onChange={() => update(i, { correct: true })} /> True</label>
              <label className="flex items-center gap-1.5"><input type="radio" checked={qq.correct === false} onChange={() => update(i, { correct: false })} /> False</label>
            </div>
          )}
        </div>
      ))}
      <button onClick={addQuestion} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.copper, ...fMono }}><Plus size={13} /> Add question</button>
    </div>
  );
}
function ModuleEditor({ modules, onChange }) {
  const [expanded, setExpanded] = useState({});
  const addModule = () => onChange([...modules, { id: uid("mod"), title: "New Module", items: [] }]);
  const updateModule = (mi, patch) => { const next = [...modules]; next[mi] = { ...next[mi], ...patch }; onChange(next); };
  const removeModule = (mi) => onChange(modules.filter((_, i) => i !== mi));
  const addItem = (mi, type) => {
    const item = type === "lesson" ? { type: "lesson", id: uid("l"), title: "New Lesson", duration: "5 min", content: "" } : { type: "quiz", id: uid("qz"), title: "New Quiz", passPercent: 70, questions: [] };
    const next = [...modules]; next[mi] = { ...next[mi], items: [...next[mi].items, item] }; onChange(next);
  };
  const updateItem = (mi, ii, patch) => { const next = [...modules]; const items = [...next[mi].items]; items[ii] = { ...items[ii], ...patch }; next[mi] = { ...next[mi], items }; onChange(next); };
  const removeItem = (mi, ii) => { const next = [...modules]; next[mi] = { ...next[mi], items: next[mi].items.filter((_, i) => i !== ii) }; onChange(next); };

  return (
    <div className="space-y-3">
      {modules.map((m, mi) => {
        const open = expanded[m.id];
        return (
          <div key={m.id} className="rounded-xl overflow-hidden" style={{ border: `1px solid ${C.inkLine}` }}>
            <div className="flex items-center gap-2 px-3 py-2.5" style={{ backgroundColor: C.inkSoft }}>
              <button onClick={() => setExpanded((e) => ({ ...e, [m.id]: !open }))}><ChevronDown size={15} color={C.textMuted} style={{ transform: open ? "rotate(180deg)" : "none" }} /></button>
              <span className="text-xs font-bold px-2 py-1 rounded shrink-0" style={{ backgroundColor: C.ink2, color: C.copper, ...fMono }}>MODULE {mi + 1}</span>
              <input value={m.title} onChange={(e) => updateModule(mi, { title: e.target.value })} className="flex-1 bg-transparent text-sm font-semibold outline-none" style={{ color: C.textLight, ...fBody }} />
              <IconBtn icon={Trash2} tone="danger" onClick={() => removeModule(mi)} title="Delete module" />
            </div>
            {open && (
              <div className="p-3 space-y-2" style={{ backgroundColor: C.ink }}>
                {m.items.map((it, ii) => (
                  <div key={it.id} className="rounded-lg p-3" style={{ backgroundColor: C.inkSoft, border: `1px solid ${C.inkLine}` }}>
                    <div className="flex items-center gap-2 mb-2">
                      <Badge tone={it.type === "quiz" ? "copper" : "mint"}>{it.type === "quiz" ? "QUIZ" : "LESSON"}</Badge>
                      <input value={it.title} onChange={(e) => updateItem(mi, ii, { title: e.target.value })} className="flex-1 bg-transparent text-sm outline-none" style={{ color: C.textLight, ...fBody }} />
                      <IconBtn icon={Trash2} tone="danger" onClick={() => removeItem(mi, ii)} title="Delete item" />
                    </div>
                    {it.type === "lesson" ? (
                      <>
                        <input value={it.duration || ""} onChange={(e) => updateItem(mi, ii, { duration: e.target.value })} placeholder="Duration, e.g. 7 min" className="w-full mb-2 rounded-lg px-3 py-1.5 text-xs outline-none" style={{ backgroundColor: C.ink2, color: C.textLight, border: `1px solid ${C.inkLine}`, ...fMono }} />
                        <textarea value={it.content} onChange={(e) => updateItem(mi, ii, { content: e.target.value })} placeholder="Lesson content" className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={{ backgroundColor: C.ink2, color: C.textLight, border: `1px solid ${C.inkLine}`, minHeight: 80, ...fBody }} />
                      </>
                    ) : (
                      <>
                        <div className="flex items-center gap-2 mb-2 text-xs" style={{ color: C.textMuted, ...fMono }}>
                          Passing % <input type="number" min={0} max={100} value={it.passPercent} onChange={(e) => updateItem(mi, ii, { passPercent: Number(e.target.value) })} className="w-16 rounded px-2 py-1" style={{ backgroundColor: C.ink2, color: C.textLight, border: `1px solid ${C.inkLine}` }} />
                        </div>
                        <QuestionEditor questions={it.questions} onChange={(qs) => updateItem(mi, ii, { questions: qs })} />
                      </>
                    )}
                  </div>
                ))}
                <div className="flex gap-2 pt-1">
                  <button onClick={() => addItem(mi, "lesson")} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.mint, ...fMono }}><Plus size={13} /> Add lesson</button>
                  <button onClick={() => addItem(mi, "quiz")} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.copper, ...fMono }}><Plus size={13} /> Add quiz</button>
                </div>
              </div>
            )}
          </div>
        );
      })}
      <button onClick={addModule} className="text-sm font-semibold flex items-center gap-1.5" style={{ color: C.copper, ...fBody }}><Plus size={15} /> Add module</button>
    </div>
  );
}
function CourseEditor({ courseId, user, courses, categories, onSave, onDelete, go, backRoute }) {
  const existing = courseId ? courses.find((c) => c.id === courseId) : null;
  const [course, setCourse] = useState(existing ? JSON.parse(JSON.stringify(existing)) : blankCourse(user.id, user.fullName));
  const [saved, setSaved] = useState(false);
  const patch = (p) => setCourse((c) => ({ ...c, ...p }));
  const canDelete = !!existing;

  const save = () => {
    if (!course.title.trim()) return;
    onSave(course);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div className="max-w-4xl mx-auto px-5 py-10">
      <button onClick={() => go(backRoute)} className="text-xs flex items-center gap-1 mb-4" style={{ color: C.textMuted, ...fMono }}><ChevronLeft size={12} /> Back</button>
      <div className="flex items-center justify-between mb-6">
        <h1 className="text-2xl font-bold" style={{ ...fDisplay, color: C.textLight }}>{existing ? "Edit course" : "Create a new course"}</h1>
        <div className="flex gap-2">
          {canDelete && <Btn variant="danger" icon={Trash2} onClick={() => { if (confirm("Delete this course? This cannot be undone.")) { onDelete(course.id); go(backRoute); } }}>Delete</Btn>}
          <Btn icon={saved ? CheckCircle2 : undefined} variant={saved ? "mint" : "primary"} onClick={save}>{saved ? "Saved" : "Save course"}</Btn>
        </div>
      </div>

      <div className="rounded-2xl p-6 mb-6" style={{ backgroundColor: C.inkSoft, border: `1px solid ${C.inkLine}` }}>
        <Input label="Course title" value={course.title} onChange={(e) => patch({ title: e.target.value })} placeholder="e.g. Advanced CSS Layouts" />
        <div className="grid sm:grid-cols-3 gap-3">
          <Select label="Category" value={course.category} onChange={(e) => patch({ category: e.target.value })} options={categories} />
          <Select label="Level" value={course.level} onChange={(e) => patch({ level: e.target.value })} options={["Beginner", "Intermediate", "Advanced"]} />
          <Input label="Duration" value={course.duration} onChange={(e) => patch({ duration: e.target.value })} placeholder="4 weeks" />
        </div>
        <Input label="Instructor name" value={course.instructor} onChange={(e) => patch({ instructor: e.target.value })} />
        <Input label="Description" textarea value={course.description} onChange={(e) => patch({ description: e.target.value })} placeholder="What is this course about?" />
        <span className="block text-xs font-semibold mb-1.5 tracking-wide uppercase" style={{ color: C.textMuted, ...fMono }}>Objectives</span>
        <ListEditor items={course.objectives} onChange={(v) => patch({ objectives: v })} placeholder="Students will be able to..." />
        <span className="block text-xs font-semibold mb-1.5 mt-3 tracking-wide uppercase" style={{ color: C.textMuted, ...fMono }}>Requirements</span>
        <ListEditor items={course.requirements} onChange={(v) => patch({ requirements: v })} placeholder="Requirement..." />
      </div>

      <h2 className="font-semibold mb-3 text-lg" style={{ ...fDisplay, color: C.textLight }}>Curriculum</h2>
      <ModuleEditor modules={course.modules} onChange={(m) => patch({ modules: m })} />
    </div>
  );
}

/* ============================================================
   INSTRUCTOR DASHBOARD & STUDENTS VIEW
   ============================================================ */
function InstructorDashboard({ go, user, courses, enrollmentIndex, announcements }) {
  const myCourses = courses.filter((c) => c.instructorId === user.id);
  const myCourseIds = new Set(myCourses.map((c) => c.id));
  const myEnrollments = enrollmentIndex.filter((e) => myCourseIds.has(e.courseId));
  const totalStudents = new Set(myEnrollments.map((e) => e.studentId)).size;
  const activeStudents = new Set(myEnrollments.filter((e) => e.pct > 0 && e.pct < 100).length ? myEnrollments.filter((e) => e.pct > 0).map((e) => e.studentId) : []).size;
  const avgCompletion = myEnrollments.length ? Math.round(myEnrollments.reduce((a, e) => a + e.pct, 0) / myEnrollments.length) : 0;
  const myAnnouncements = announcements.filter((a) => myCourseIds.has(a.courseId));

  return (
    <div className="max-w-6xl mx-auto px-5 py-10">
      <h1 className="text-3xl font-bold mb-1" style={{ ...fDisplay, color: C.textLight }}>Instructor Dashboard</h1>
      <p className="mb-8" style={{ color: C.textMuted, ...fBody }}>Welcome back, {user.fullName}.</p>
      <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
        <StatCard icon={Users} label="Total Students" value={totalStudents} />
        <StatCard icon={BookOpen} label="Your Courses" value={myCourses.length} />
        <StatCard icon={TrendingUp} label="Active Students" value={activeStudents} />
        <StatCard icon={ClipboardCheck} label="Avg. Completion" value={`${avgCompletion}%`} />
      </div>
      <Section title="Your courses" action={<Btn size="sm" icon={Plus} onClick={() => go("course-editor", { id: null })}>New course</Btn>}>
        {myCourses.length === 0 ? <EmptyState text="You haven't created a course yet." /> : (
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
            {myCourses.map((c) => {

function synthTrend(base, months = 6) {
  const names = ["Mar", "Apr", "May", "Jun", "Jul", "Aug"];
  let v = Math.max(1, Math.round(base * 0.55));
  return names.slice(-months).map((m, i) => { v = Math.round(v + (base - v) * 0.35 + i); return { month: m, value: v }; });
}

function AttachmentPicker({ file, onChange, label = "Attach a file (optional, under 1.5MB)" }) {
  const [error, setError] = useState("");
  const handle = async (e) => {
    setError("");
    const f = e.target.files?.[0];
    if (!f) return;
    if (f.size > MAX_FILE_BYTES) { setError("That file is too large — please attach something under 1.5MB."); e.target.value = ""; return; }
    try {
      const dataUrl = await fileToDataUrl(f);
      onChange({ name: f.name, size: f.size, dataUrl });
    } catch { setError("Could not read that file. Please try again."); }
  };
  return (
    <div className="mb-4">
      <span className="block text-xs font-semibold mb-1.5 tracking-wide uppercase" style={{ color: C.textMuted, ...fMono }}>{label}</span>
      {file ? (

          <IconBtn icon={Trash2} tone="danger" onClick={() => onChange(null)} title="Remove attachment" />
        </div>
      ) : (
        <label className="flex items-center gap-2 rounded-lg px-3 py-2.5 cursor-pointer text-sm" style={{ backgroundColor: C.ink2, border: `1px dashed ${C.inkLine}`, color: C.textMuted, ...fBody }}>
          <Upload size={14} /> Choose a file<input type="file" className="hidden" onChange={handle} />
        </label>
      )}
      {error && <span className="flex items-center gap-1 mt-1 text-xs" style={{ color: C.danger }}><AlertCircle size={12} />{error}</span>}
    </div>
  );
}
function AttachmentLink({ file }) {
  if (!file) return null;
  return <a href={file.dataUrl} download={file.name} className="inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1.5 rounded-lg" style={{ backgroundColor: `${C.copper}1A`, color: C.copper, ...fMono }}><Download size={12} />{file.name}</a>;
}

function AssignmentEditor({ courseId, assignmentId, user, courses, assignments, onSave, onDelete, go, backRoute }) {
  const course = courses.find((c) => c.id === courseId);
  const existing = assignmentId ? assignments.find((a) => a.id === assignmentId) : null;
  const [form, setForm] = useState(existing || {
    id: uid("asg"), courseId, courseTitle: course?.title || "", moduleId: course?.modules[0]?.id || "", title: "",
    description: "", instructions: "", dueDate: "", maxScore: 100, resource: null,
    createdBy: user.id, authorName: user.fullName, createdAt: new Date().toISOString(),
  });
  const [saved, setSaved] = useState(false);
  if (!course) return <EmptyState text="Course not found." />;
  const patch = (p) => setForm((f) => ({ ...f, ...p }));
  const save = () => { if (!form.title.trim()) return; onSave(form); setSaved(true); setTimeout(() => setSaved(false), 1800); };

  return (
    <div className="max-w-2xl mx-auto px-5 py-10">
      <button onClick={() => go(backRoute, { courseId })} className="text-xs flex items-center gap-1 mb-4" style={{ color: C.textMuted, ...fMono }}><ChevronLeft size={12} /> Back to assignments</button>
      <div className="flex items-center justify-between mb-6">
        <h1 className="text-2xl font-bold" style={{ ...fDisplay, color: C.textLight }}>{existing ? "Edit assignment" : "New assignment"}</h1>
        <div className="flex gap-2">
          {existing && <Btn variant="danger" icon={Trash2} onClick={() => { if (confirm("Delete this assignment? Student submissions will be removed too.")) { onDelete(form.id); go(backRoute, { courseId }); } }}>Delete</Btn>}
          <Btn icon={saved ? CheckCircle2 : undefined} variant={saved ? "mint" : "primary"} onClick={save}>{saved ? "Saved" : "Save assignment"}</Btn>
        </div>
      </div>
      <div className="rounded-2xl p-6" style={{ backgroundColor: C.inkSoft, border: `1px solid ${C.inkLine}` }}>
        <p className="text-xs mb-4" style={{ color: C.textMuted, ...fMono }}>COURSE: {course.title}</p>
        <Input label="Title" value={form.title} onChange={(e) => patch({ title: e.target.value })} placeholder="e.g. Build a personal landing page" />
        <Select label="Module" value={form.moduleId} onChange={(e) => patch({ moduleId: e.target.value })} options={course.modules.map((m) => m.id)} />
        <p className="text-xs -mt-3 mb-4" style={{ color: C.textMuted, ...fBody }}>{course.modules.find((m) => m.id === form.moduleId)?.title}</p>
        <Input label="Description" textarea value={form.description} onChange={(e) => patch({ description: e.target.value })} placeholder="Short summary of the task" />
        <Input label="Instructions" textarea value={form.instructions} onChange={(e) => patch({ instructions: e.target.value })} placeholder="Step-by-step expectations for the submission" />
        <div className="grid sm:grid-cols-2 gap-3">
          <label className="block mb-4">
            <span className="block text-xs font-semibold mb-1.5 tracking-wide uppercase" style={{ color: C.textMuted, ...fMono }}>Due date</span>
            <input type="datetime-local" value={form.dueDate} onChange={(e) => patch({ dueDate: e.target.value })} className="w-full rounded-lg px-3.5 py-2.5 text-sm outline-none" style={{ backgroundColor: C.ink2, color: C.textLight, border: `1px solid ${C.inkLine}`, ...fBody }} />
          </label>

            <span className="block text-xs font-semibold mb-1.5 tracking-wide uppercase" style={{ color: C.textMuted, ...fMono }}>Max score</span>

function InstructorGrade({ assignmentId, courses, assignments, enrollmentIndex, submissions, onGrade, go }) {
  const assignment = assignments.find((a) => a.id === assignmentId);

  const course = courses.find((c) => c.id === assignment.courseId);
  const roster = enrollmentIndex.filter((e) => e.courseId === assignment.courseId);

  const rows = roster.map((r) => {
    const sub = submissions.find((s) => s.assignmentId === assignmentId && s.studentId === r.studentId) || null;
    return { student: r, sub, status: submissionStatus(assignment, sub) };
  }).sort((a, b) => (a.sub ? 0 : 1) - (b.sub ? 0 : 1));

  return (
    <div className="max-w-3xl mx-auto px-5 py-10">
      <button onClick={() => go("instructor-assignments", { courseId: assignment.courseId })} className="text-xs flex items-center gap-1 mb-4" style={{ color: C.textMuted, ...fMono }}><ChevronLeft size={12} /> Back to assignments</button>

        <div className="space-y-3">
          {rows.map(({ student, sub, status }) => {

              <div key={student.studentId} className="rounded-xl p-4" style={{ backgroundColor: C.inkSoft, border: `1px solid ${C.inkLine}` }}>
                <div className="flex items-center justify-between gap-3 flex-wrap mb-2">
                  <p className="font-semibold text-sm" style={{ color: C.textLight, ...fBody }}>{student.studentName}</p>
                  <Badge tone={STATUS_META[status].tone}>{STATUS_META[status].label}</Badge>

                    <div className="flex items-end gap-2 flex-wrap">

                        <input type="number" min={0} max={assignment.maxScore} value={draft.grade} onChange={(e) => setDrafts((d) => ({ ...d, [student.studentId]: { ...draft, grade: e.target.value } }))} className="w-24 rounded-lg px-3 py-2 text-sm outline-none" style={{ backgroundColor: C.ink2, color: C.textLight, border: `1px solid ${C.inkLine}` }} />
                      </label>
                      <label className="flex-1 min-w-[180px]"><span className="block text-xs font-semibold mb-1" style={{ color: C.textMuted, ...fMono }}>Feedback</span>
                        <input value={draft.feedback} onChange={(e) => setDrafts((d) => ({ ...d, [student.studentId]: { ...draft, feedback: e.target.value } }))} className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={{ backgroundColor: C.ink2, color: C.textLight, border: `1px solid ${C.inkLine}`, ...fBody }} placeholder="Optional feedback" />
                      </label>

const PLAYGROUND_DEFAULT = {
  html: `<h1>Hello, Web Academy!</h1>\n<p>Edit the HTML, CSS, and JavaScript tabs, then hit Run.</p>\n<button id="btn">Click me</button>`,
  css: `body { font-family: sans-serif; padding: 24px; color: #1B2430; }\nh1 { color: #C97A3D; }\nbutton { padding: 8px 16px; border-radius: 8px; border: none; background: #C97A3D; color: white; cursor: pointer; font-weight: 600; }`,
  js: `document.getElementById("btn").addEventListener("click", () => {\n  document.querySelector("p").textContent = "You ran real JavaScript in the playground!";\n});`,
};
function buildPlaygroundDoc(code) {
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${code.css}</style></head><body>${code.html}<script>\n${code.js}\n<\/script></body></html>`;
}
function CodePlayground() {
  const [tab, setTab] = useState("html");
  const [code, setCode] = useState(PLAYGROUND_DEFAULT);
  const [srcDoc, setSrcDoc] = useState(() => buildPlaygroundDoc(PLAYGROUND_DEFAULT));
  const tabs = [["html", "HTML"], ["css", "CSS"], ["js", "JavaScript"]];
  const run = () => setSrcDoc(buildPlaygroundDoc(code));
  const reset = () => { setCode(PLAYGROUND_DEFAULT); setSrcDoc(buildPlaygroundDoc(PLAYGROUND_DEFAULT)); };
  return (
    <div className="max-w-6xl mx-auto px-5 py-8">
      <div className="flex items-center gap-2 mb-2"><Terminal size={20} color={C.copper} /><h1 className="text-2xl font-bold" style={{ ...fDisplay, color: C.textLight }}>Code Playground</h1></div>
      <p className="mb-6 text-sm" style={{ color: C.textMuted, ...fBody }}>Write HTML, CSS, and JavaScript and see it run instantly in a sandboxed preview — no setup required, and nothing here can touch the rest of the site.</p>
      <div className="grid lg:grid-cols-2 gap-5">
        <div className="rounded-2xl overflow-hidden" style={{ border: `1px solid ${C.inkLine}` }}>
          <div className="flex items-center justify-between flex-wrap gap-2 px-2" style={{ backgroundColor: C.inkSoft }}>
            <div className="flex">
              {tabs.map(([key, label]) => (
                <button key={key} onClick={() => setTab(key)} className="px-4 py-2.5 text-xs font-semibold" style={{ color: tab === key ? C.copper : C.textMuted, borderBottom: tab === key ? `2px solid ${C.copper}` : "2px solid transparent", ...fMono }}>{label}</button>
              ))}
            </div>
            <div className="flex gap-2 my-1.5">
              <Btn size="sm" variant="outline" icon={RotateCcw} onClick={reset}>Reset</Btn>
              <Btn size="sm" icon={PlayCircle} onClick={run}>Run Code</Btn>
            </div>
          </div>
          <textarea value={code[tab]} onChange={(e) => setCode({ ...code, [tab]: e.target.value })} spellCheck={false} className="w-full outline-none p-4 text-sm" style={{ backgroundColor: "#0A0F17", color: "#B8E3C9", minHeight: 420, ...fMono }} />
        </div>
        <div className="rounded-2xl overflow-hidden" style={{ border: `1px solid ${C.inkLine}` }}>
          <div className="px-4 py-2.5 text-xs font-semibold" style={{ backgroundColor: C.inkSoft, color: C.textMuted, ...fMono }}>PREVIEW</div>
          <iframe title="playground-preview" srcDoc={srcDoc} sandbox="allow-scripts" style={{ width: "100%", height: 420, border: "none", backgroundColor: "#fff" }} />
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   ROOT APP
   ============================================================ */
function App() {
  const [route, setRoute] = useState({ name: "landing", params: {} });
  const [user, setUser] = useState(null);
  const [users, setUsers] = useState([]);
  const [courses, setCourses] = useState([]);
  const [categories, setCategories] = useState(SEED_CATEGORIES);
  const [settings, setSettings] = useState({ siteName: "WEB ACADEMY", tagline: "Learn. Build. Create. Grow." });
  const [announcements, setAnnouncements] = useState([]);
  const [certificates, setCertificates] = useState([]);
  const [enrollmentIndex, setEnrollmentIndex] = useState([]);
  const [assignments, setAssignments] = useState([]);
  const [submissions, setSubmissions] = useState([]);
  const [studentData, setStudentData] = useState(emptyStudentData());
  const [notifications, setNotifications] = useState([]);
  const [loading, setLoading] = useState(true);

  const go = useCallback((name, params = {}) => { setRoute({ name, params }); window.scrollTo(0, 0); }, []);

  useEffect(() => {
    (async () => {
      try {
        const [u, c, cats, s, ann, certs, idx, asg, subs] = await Promise.all([ensureDemoUsers(), ensureCourses(), ensureCategories(), ensureSettings(), getJSON("wa:announcements", []), getJSON("wa:certificates", []), getJSON("wa:enrollmentIndex", []), ensureAssignments(), getJSON("wa:submissions", [])]);
        setUsers(u); setCourses(c); setCategories(cats); setSettings(s); setAnnouncements(ann); setCertificates(certs); setEnrollmentIndex(idx); setAssignments(asg); setSubmissions(subs);
        const sessionRes = await window.storage.get("wa:session").catch(() => null);
        if (sessionRes) {
          const session = JSON.parse(sessionRes.value);
          const found = u.find((x) => x.id === session.userId);
          if (found) {
            setUser(found);
            if (found.role === "student") setStudentData(await loadStudentData(found.id));
            setNotifications(await loadNotifications(found.id));
          }
        }
      } catch (e) { console.error("Web Academy failed to load initial data:", e); }
      setLoading(false);
    })();
  }, []);

  const persistStudent = useCallback(async (userId, data) => { setStudentData(data); await saveStudentData(userId, data); }, []);

  // Push a notification into any user's stored list (works whether or not
  // that user is the one currently logged in — e.g. an instructor grading a
  // submission needs to notify a student who isn't in this browser session).
  const pushNotification = useCallback(async (targetUserId, notif) => {
    const existing = await loadNotifications(targetUserId);
    const next = [{ id: uid("notif"), read: false, createdAt: new Date().toISOString(), ...notif }, ...existing];
    await saveNotifications(targetUserId, next);
    setNotifications((cur) => (user && user.id === targetUserId ? next : cur));
  }, [user]);

  const handleLogin = async (u) => {
    setUser(u);
    await setJSON("wa:session", { userId: u.id });
    if (u.role === "student") {
      try { setStudentData(await loadStudentData(u.id)); }
      catch (e) { console.warn("Web Academy: failed to load student data", e); }
    }
    try { setNotifications(await loadNotifications(u.id)); } catch { setNotifications([]); }
    go(dashboardRoute(u.role));
  };
  const handleLogout = async () => { await window.storage.delete("wa:session").catch(() => {}); setUser(null); setStudentData(emptyStudentData()); setNotifications([]); go("landing"); };
  const handleMarkNotificationRead = async (id) => {
    if (!user) return;
    const next = notifications.map((n) => (n.id === id ? { ...n, read: true } : n));
    setNotifications(next);
    await saveNotifications(user.id, next);
  };

  const computeCourseStats = useCallback((course, data) => {
    const items = flattenItems(course);
    const doneCount = items.filter((it) => data.progress[pk(course.id, it.id)]).length;
    const pct = items.length ? Math.round((doneCount / items.length) * 100) : 0;
    return { pct, doneCount, total: items.length };
  }, []);

  const updateEnrollmentIndex = useCallback(async (updater) => {
    setEnrollmentIndex((prev) => { const next = updater(prev); setJSON("wa:enrollmentIndex", next); return next; });
  }, []);

  const handleEnroll = async (courseId) => {
    if (!user) return;
    if (studentData.enrollments.some((e) => e.courseId === courseId)) return;
    const next = { ...studentData, enrollments: [...studentData.enrollments, { courseId, enrolledAt: new Date().toISOString() }] };
    await persistStudent(user.id, next);
    const course = courses.find((c) => c.id === courseId);
    await updateEnrollmentIndex((prev) => [...prev, { studentId: user.id, studentName: user.fullName, courseId, courseTitle: course?.title || "", enrolledAt: new Date().toISOString(), pct: 0 }]);
  };
  const handleMarkComplete = async (courseId, itemId) => {
    if (!user) return;
    const next = withActivity({ ...studentData, progress: { ...studentData.progress, [pk(courseId, itemId)]: true } });
    await persistStudent(user.id, next);
    syncProgressToIndex(next);
  };
  const handleQuizSubmit = async (courseId, quizId, quizTitle, result) => {
    if (!user) return;
    const nextAttempts = { ...studentData.quizAttempts, [pk(courseId, quizId)]: result };
    const nextProgress = { ...studentData.progress };
    if (result.passed) nextProgress[pk(courseId, quizId)] = true;
    const next = withActivity({ ...studentData, quizAttempts: nextAttempts, progress: nextProgress });
    await persistStudent(user.id, next);
    syncProgressToIndex(next);
    pushNotification(user.id, {
      title: result.passed ? `Quiz passed — ${result.pct}%` : `Quiz result — ${result.pct}%`,
      message: `${quizTitle}: you scored ${result.score}/${result.total}.`,
      link: { route: "lesson", params: { courseId, itemId: quizId } },
    });
  };
  const syncProgressToIndex = (data) => {
    updateEnrollmentIndex((prev) => prev.map((e) => {
      if (e.studentId !== user.id) return e;
      const course = courses.find((c) => c.id === e.courseId);
      if (!course) return e;
      return { ...e, pct: computeCourseStats(course, data).pct };
    }));
  };
  const handleReadAnnouncement = async (id) => {
    if (!user) return;
    const next = { ...studentData, readAnnouncements: { ...studentData.readAnnouncements, [id]: true } };
    await persistStudent(user.id, next);
  };
  const handleGenerateCertificate = async (course) => {
    if (!user) return;
    const cert = { id: `CERT-${genCode(6)}`, code: genCode(8), courseId: course.id, courseName: course.title, studentName: user.fullName, studentId: user.id, instructor: course.instructor, date: new Date().toISOString(), revoked: false };
    const all = await getJSON("wa:certificates", []);
    const next = [...all, cert];
    await setJSON("wa:certificates", next);
    setCertificates(next);
    pushNotification(user.id, { title: "Certificate earned!", message: `Your certificate for ${course.title} is ready.`, link: { route: "certificate", params: { courseId: course.id } } });
  };

  const handleSaveCourse = async (course) => {
    const exists = courses.some((c) => c.id === course.id);
    const next = exists ? courses.map((c) => (c.id === course.id ? course : c)) : [...courses, course];
    setCourses(next);
    await setJSON("wa:courses", next);
  };
  const handleDeleteCourse = async (courseId) => {
    const next = courses.filter((c) => c.id !== courseId);
    setCourses(next);
    await setJSON("wa:courses", next);
  };

  const handleSaveAssignment = async (assignment) => {
    const exists = assignments.some((a) => a.id === assignment.id);
    const next = exists ? assignments.map((a) => (a.id === assignment.id ? assignment : a)) : [...assignments, assignment];
    setAssignments(next);
    await setJSON("wa:assignments", next);
  };
  const handleDeleteAssignment = async (id) => {
    const nextAssignments = assignments.filter((a) => a.id !== id);
    setAssignments(nextAssignments);
    await setJSON("wa:assignments", nextAssignments);
    const nextSubmissions = submissions.filter((s) => s.assignmentId !== id);
    setSubmissions(nextSubmissions);
    await setJSON("wa:submissions", nextSubmissions);
  };
  const handleSubmitAssignment = async (submission) => {
    const exists = submissions.some((s) => s.id === submission.id);
    const next = exists ? submissions.map((s) => (s.id === submission.id ? submission : s)) : [...submissions, submission];
    setSubmissions(next);
    await setJSON("wa:submissions", next);
    if (user && user.role === "student") await persistStudent(user.id, withActivity(studentData));
    const course = courses.find((c) => c.id === submission.courseId);
    if (course?.instructorId) {
      pushNotification(course.instructorId, {
        title: "New submission to grade",
        message: `${submission.studentName} submitted "${assignments.find((a) => a.id === submission.assignmentId)?.title || "an assignment"}".`,
        link: { route: "instructor-grade", params: { assignmentId: submission.assignmentId } },
      });
    }
  };
  const handleGradeSubmission = async (submissionId, grade, feedback) => {
    const next = submissions.map((s) => (s.id === submissionId ? { ...s, grade, feedback, gradedAt: new Date().toISOString() } : s));
    setSubmissions(next);
    await setJSON("wa:submissions", next);
    const sub = submissions.find((s) => s.id === submissionId);
    const assignment = assignments.find((a) => a.id === sub?.assignmentId);
    if (sub) {
      pushNotification(sub.studentId, {
        title: "Assignment graded",
        message: `${assignment?.title || "Your assignment"}: you scored ${grade}/${assignment?.maxScore ?? 100}.`,
        link: { route: "assignment", params: { id: sub.assignmentId } },
      });
    }
  };

  const handleCreateAnnouncement = async (a) => {
    const next = [...announcements, a];
    setAnnouncements(next);
    await setJSON("wa:announcements", next);
    const recipientIds = a.audience === "platform"
      ? users.filter((u) => u.role === "student").map((u) => u.id)
      : [...new Set(enrollmentIndex.filter((e) => e.courseId === a.courseId).map((e) => e.studentId))];
    recipientIds.forEach((id) => pushNotification(id, { title: a.title, message: a.body, link: { route: "dashboard", params: {} } }));
  };
  const handleDeleteAnnouncement = async (id) => { const next = announcements.filter((a) => a.id !== id); setAnnouncements(next); await setJSON("wa:announcements", next); };

  const handleChangeCategories = async (next) => { setCategories(next); await setJSON("wa:categories", next); };
  const handleSaveSettings = async (next) => { setSettings(next); await setJSON("wa:settings", next); };
  const handleRevokeCertificate = async (id) => { const next = certificates.map((c) => (c.id === id ? { ...c, revoked: true } : c)); setCertificates(next); await setJSON("wa:certificates", next); };

  const handleCreateUser = async ({ fullName, email, username, password, role }) => {
    const latestUsers = await getJSON("wa:users", users);
    if (latestUsers.find((u) => u.email.toLowerCase() === email.toLowerCase())) return { error: "That email is already registered." };
    if (latestUsers.find((u) => u.username.toLowerCase() === username.toLowerCase())) return { error: "That username is taken." };
    const passwordHash = await hashPassword(password);
    const newUser = { id: uid("u"), fullName, email, username, phone: "", role, passwordHash };
    const next = [...latestUsers, newUser];
    setUsers(next); await setJSON("wa:users", next);
    return { ok: true };
  };
  const handleToggleSuspend = async (id) => { const next = users.map((u) => (u.id === id ? { ...u, suspended: !u.suspended } : u)); setUsers(next); await setJSON("wa:users", next); };
  const handleDeleteUser = async (id) => { const next = users.filter((u) => u.id !== id); setUsers(next); await setJSON("wa:users", next); };

  const myCertificates = useMemo(() => (user ? certificates.filter((c) => c.studentId === user.id && !c.revoked) : []), [certificates, user]);
  const enrollmentsWithPct = useMemo(() => studentData.enrollments.map((e) => {
    const course = courses.find((c) => c.id === e.courseId);
    return { courseId: e.courseId, pct: course ? computeCourseStats(course, studentData).pct : 0 };
  }), [studentData, courses, computeCourseStats]);

  // Derived "due soon" reminders — computed fresh each render, not persisted,
  // so they always reflect the current due dates rather than going stale.
  const dueSoonNotifications = useMemo(() => {
    if (!user || user.role !== "student") return [];
    const now = Date.now();
    return assignments
      .filter((a) => studentData.enrollments.some((e) => e.courseId === a.courseId) && a.dueDate)
      .filter((a) => !submissions.some((s) => s.assignmentId === a.id && s.studentId === user.id))
      .filter((a) => { const days = (new Date(a.dueDate).getTime() - now) / 86400000; return days > 0 && days <= 3; })
      .map((a) => ({ id: `due:${a.id}`, read: false, createdAt: a.dueDate, title: `Due soon: ${a.title}`, message: `${a.courseTitle} · due ${new Date(a.dueDate).toLocaleDateString()}.`, link: { route: "assignment", params: { id: a.id } } }));
  }, [assignments, submissions, studentData, user]);
  const allNotifications = useMemo(() => [...dueSoonNotifications, ...notifications], [dueSoonNotifications, notifications]);

  if (loading) return <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: C.ink }}><Loader2 className="animate-spin" color={C.copper} /></div>;

  const requireRole = (role, node) => {
    if (!user) return <Login go={go} onLogin={handleLogin} />;
    if (user.role !== role) return <EmptyState icon={Lock} text="You don't have access to this page." action={<Btn className="mt-4" onClick={() => go(dashboardRoute(user.role))}>Go to your dashboard</Btn>} />;
    return node;
  };

  let page;
  if (route.name === "landing") page = <Landing go={go} courses={courses} settings={settings} />;
  else if (route.name === "login") page = <Login go={go} onLogin={handleLogin} />;
  else if (route.name === "register") page = <Register go={go} onLogin={handleLogin} />;
  else if (route.name === "catalog") page = <Catalog go={go} courses={courses} categories={categories} enrollments={enrollmentsWithPct} initialQuery={route.params.q || ""} />;
  else if (route.name === "course") page = <CourseDetail courseId={route.params.id} go={go} user={user} courses={courses} studentData={studentData} onEnroll={handleEnroll} computeCourseStats={computeCourseStats} assignments={assignments} submissions={submissions} />;
  else if (route.name === "lesson") page = <LessonViewer courseId={route.params.courseId} itemId={route.params.itemId} go={go} user={user} courses={courses} studentData={studentData} onMarkComplete={handleMarkComplete} onQuizSubmit={handleQuizSubmit} />;
  else if (route.name === "playground") page = <CodePlayground />;
  else if (route.name === "dashboard") page = user ? <Dashboard go={go} user={user} courses={courses} studentData={studentData} computeCourseStats={computeCourseStats} certificates={myCertificates} announcements={announcements} onReadAnnouncement={handleReadAnnouncement} assignments={assignments} submissions={submissions} /> : <Login go={go} onLogin={handleLogin} />;
  else if (route.name === "assignment") page = user ? <AssignmentDetail assignmentId={route.params.id} user={user} courses={courses} assignments={assignments} studentData={studentData} mySubmission={submissions.find((s) => s.assignmentId === route.params.id && s.studentId === user.id) || null} onSubmit={handleSubmitAssignment} go={go} /> : <Login go={go} onLogin={handleLogin} />;
  else if (route.name === "certificate") page = user ? <CertificatePage courseId={route.params.courseId} user={user} courses={courses} studentData={studentData} certificates={myCertificates} computeCourseStats={computeCourseStats} onGenerate={handleGenerateCertificate} go={go} /> : <Login go={go} onLogin={handleLogin} />;
  else if (route.name === "verify") page = <VerifyPage />;
  else if (route.name === "instructor-dashboard") page = requireRole("instructor", <InstructorDashboard go={go} user={user} courses={courses} enrollmentIndex={enrollmentIndex} announcements={announcements} />);
  else if (route.name === "instructor-students") page = requireRole("instructor", <InstructorStudents courseId={route.params.courseId} courses={courses} enrollmentIndex={enrollmentIndex} go={go} />);
  else if (route.name === "instructor-announce") page = requireRole("instructor", <InstructorAnnounce courseId={route.params.courseId} user={user} courses={courses} announcements={announcements} onCreate={handleCreateAnnouncement} onDelete={handleDeleteAnnouncement} go={go} />);
  else if (route.name === "course-editor") page = (!user || (user.role !== "instructor" && user.role !== "admin")) ? <Login go={go} onLogin={handleLogin} /> : <CourseEditor courseId={route.params.id} user={user} courses={courses} categories={categories} onSave={handleSaveCourse} onDelete={handleDeleteCourse} go={go} backRoute={dashboardRoute(user.role) === "admin-dashboard" ? "admin-courses" : "instructor-dashboard"} />;
  else if (route.name === "instructor-assignments") page = requireRole("instructor", <InstructorAssignments courseId={route.params.courseId} user={user} courses={courses} assignments={assignments} submissions={submissions} go={go} />);
  else if (route.name === "assignment-editor") page = (!user || (user.role !== "instructor" && user.role !== "admin")) ? <Login go={go} onLogin={handleLogin} /> : <AssignmentEditor courseId={route.params.courseId} assignmentId={route.params.id} user={user} courses={courses} assignments={assignments} onSave={handleSaveAssignment} onDelete={handleDeleteAssignment} go={go} backRoute={dashboardRoute(user.role) === "admin-dashboard" ? "admin-assignments" : "instructor-assignments"} />;
  else if (route.name === "instructor-grade") page = (!user || (user.role !== "instructor" && user.role !== "admin")) ? <Login go={go} onLogin={handleLogin} /> : <InstructorGrade assignmentId={route.params.assignmentId} courses={courses} assignments={assignments} enrollmentIndex={enrollmentIndex} submissions={submissions} onGrade={handleGradeSubmission} go={go} />;
  else if (route.name === "admin-dashboard") page = requireRole("admin", <AdminDashboard go={go} users={users} courses={courses} enrollmentIndex={enrollmentIndex} certificates={certificates} />);
  else if (route.name === "admin-users") page = requireRole("admin", <AdminUsers go={go} users={users} onCreateUser={handleCreateUser} onToggleSuspend={handleToggleSuspend} onDeleteUser={handleDeleteUser} />);
  else if (route.name === "admin-courses") page = requireRole("admin", <AdminCourses go={go} courses={courses} />);
  else if (route.name === "admin-categories") page = requireRole("admin", <AdminCategories go={go} categories={categories} onChange={handleChangeCategories} />);
  else if (route.name === "admin-announcements") page = requireRole("admin", <AdminAnnouncements go={go} user={user} announcements={announcements} onCreate={handleCreateAnnouncement} onDelete={handleDeleteAnnouncement} />);
  else if (route.name === "admin-certificates") page = requireRole("admin", <AdminCertificates go={go} certificates={certificates} onRevoke={handleRevokeCertificate} />);
  else if (route.name === "admin-assignments") page = requireRole("admin", <AdminAssignments go={go} assignments={assignments} submissions={submissions} courses={courses} />);
  else if (route.name === "admin-settings") page = requireRole("admin", <AdminSettings go={go} settings={settings} onSave={handleSaveSettings} />);
  else page = <Landing go={go} courses={courses} settings={settings} />;

  return (
    <div style={{ backgroundColor: C.ink, minHeight: "100vh", ...fBody }}>
      <style>{FONT_IMPORT}</style>
      <Navbar route={route} go={go} user={user} onLogout={handleLogout} settings={settings} courses={courses} notifications={allNotifications} onMarkNotificationRead={handleMarkNotificationRead} />
      {page}
      {route.name === "landing" && <Footer settings={settings} />}
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
